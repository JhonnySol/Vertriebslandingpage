<!DOCTYPE html>
<html lang="de" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Room 3 STUDIO | Dein Kontrollzentrum</title>

    <link rel="icon" type="image/png" href="room3logo.png">
    
    <script src="https://w.soundcloud.com/player/api.js" type="text/javascript"></script>

    <style>
        :root {
            --primary-gold: #d4af37;
            --glass-bg: rgba(5, 5, 5, 0.8); 
            --border-gold: rgba(212, 175, 55, 0.4);
            --glow-gold: rgba(212, 175, 55, 0.2);
        }

        /* --- GOOGLE TRANSLATE FIX: KEINE LEISTE --- */
        .goog-te-banner-frame.skiptranslate,
        .goog-te-banner-frame,
        #goog-gt-tt,
        .goog-te-balloon-frame,
        .goog-te-gadget-icon,
        .goog-te-banner,
        .goog-tooltip,
        .goog-tooltip:hover,
        .VIpgJd-Zvi9ab-OR9sP-bgnd {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }

        body {
            top: 0px !important; 
            position: static !important;
        }

        /* Dropdown Style */
        #google_translate_element select.goog-te-combo {
            background: #000 !important;
            color: var(--primary-gold) !important;
            border: 1px solid var(--primary-gold) !important;
            border-radius: 20px !important;
            padding: 8px 12px !important;
            font-weight: bold !important;
            outline: none !important;
        }

        /* --- BASIS LAYOUT & HINTERGRUND --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        section#main-studio {
            width: 100%;
            min-height: 100vh;
            background: url('studio.png') no-repeat center center / cover;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (max-width: 768px) {
            section#main-studio {
                background: url('studiomobil.png') no-repeat center center / cover;
            }
        }

        .studio-logo-small {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 140px;
            z-index: 100;
        }

        header {
            text-align: center;
            padding: 80px 20px 20px;
            z-index: 10;
        }

        header h1 {
            font-size: 3.5rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            font-weight: 900;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        header h1 span {
            color: var(--primary-gold);
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 6px;
            opacity: 0.8;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* DASHBOARD GRID */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1350px;
            margin: 0 auto;
            padding: 20px 20px 100px;
            z-index: 5;
        }

        .control-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-gold);
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            transition: transform 0.3s ease;
        }

        .control-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-gold);
        }

        .card-icon {
            font-size: 2.2rem;
            color: var(--primary-gold);
            margin-bottom: 20px;
        }

        .control-card h3 {
            font-size: 1.6rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .control-card h3 span {
            color: var(--primary-gold);
        }

        /* LIVE STATUS */
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0, 255, 65, 0.1);
            padding: 8px 15px;
            border-radius: 10px;
            width: fit-content;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #00ff41;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff41;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .live-text { font-size: 0.7rem; font-weight: bold; color: #00ff41; text-transform: uppercase; }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.75rem;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .studio-input {
            width: 100%;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .btn-gold {
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            width: 100%;
            margin-bottom: 12px;
        }

        .btn-outline {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 16px;
            border-radius: 15px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* --- PLAYER UNTEN RECHTS --- */
        .sc-player-fixed-right {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 10000;
        }

        .music-btn-circle {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(0,0,0,0.9);
            border: 2px solid var(--primary-gold);
            color: var(--primary-gold);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
        }

        .sponsor-badge-left {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: rgba(0,0,0,0.85);
            border: 1px solid var(--border-gold);
            padding: 12px 25px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
        }

        .status-dot-green { width: 12px; height: 12px; background: #00ff41; border-radius: 50%; box-shadow: 0 0 10px #00ff41; }
        #badge-name { font-weight: bold; color: #fff; font-size: 1.1rem; }

        #google_translate_element {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 10001;
        }

        #sc-widget-hidden { display: none; }

        @media (max-width: 1024px) {
            header h1 { font-size: 2.2rem; }
            .dashboard-grid { grid-template-columns: 1fr; padding: 20px; }
        }
    </style>
</head>
<body class="skiptranslate">

    <section id="main-studio">
        
        <img src="room3logo.png" alt="Logo" class="studio-logo-small">

        <div id="google_translate_element"></div>

        <header>
            <h1>Room 3 <span>Studio</span></h1>
            <p class="subtitle">DEIN KONTROLLZENTRUM</p>
        </header>

        <div class="dashboard-grid">
            
            <div class="control-card">
                <div class="card-icon">📡</div>
                <div class="live-indicator">
                    <div class="dot"></div>
                    <span class="live-text">DU BIST LIVE</span>
                </div>
                <h3>Elite Meet <span>Zentrale</span></h3>
                <div class="input-group">
                    <label>DEIN GOOGLE MEET LINK</label>
                    <input type="text" id="meet-code" class="studio-input" placeholder="https://meet.google.com/xxx-xxxx-xxx">
                </div>
                <button class="btn-gold" onclick="startMeeting()">MEINEN RAUM STARTEN</button>
                <button class="btn-outline" id="copy-meet-btn" onclick="copyMeetLink()">LINK KOPIEREN</button>
            </div>

            <div class="control-card">
                <div class="card-icon">👤</div>
                <h3>Sponsor <span>Profil</span></h3>
                <div class="input-group">
                    <label>DEIN ÖFFENTLICHER NAME</label>
                    <input type="text" id="display-name" class="studio-input" placeholder="Name" oninput="updatePersonalLink();">
                </div>
                <div class="input-group">
                    <label>MYCOINTAINER REF-LINK</label>
                    <input type="text" id="myc-ref" class="studio-input" placeholder="https://..." oninput="updatePersonalLink();">
                </div>
                <button class="btn-gold" id="save-btn" onclick="saveProfile()">PROFIL SPEICHERN</button>
            </div>

            <div class="control-card">
                <div class="card-icon">🚀</div>
                <h3>Marketing <span>Link</span></h3>
                <div class="input-group">
                    <label>DEIN PERSONALISIERTER LINK</label>
                    <input type="text" id="personal-url" class="studio-input" readonly style="color: var(--primary-gold); font-weight: bold;">
                </div>
                <button class="btn-outline" id="copy-marketing-btn" onclick="copyPersonalLink()">LINK KOPIEREN</button>
            </div>

        </div>

        <div class="sponsor-badge-left">
            <div class="status-dot-green"></div>
            <div>
                <span style="font-size: 0.6rem; color: var(--primary-gold); display: block; font-weight: 900;">STATUS: AKTIV</span>
                <span id="badge-name">Laden...</span>
            </div>
        </div>

        <div class="sc-player-fixed-right">
            <div class="music-btn-circle" id="m-btn-circle" onclick="toggleStudioMusic()">🎵</div>
        </div>

    </section>

    <div id="sc-widget-hidden">
        <iframe id="sc-widget" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" 
            src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/astateoftrance/a-state-of-trance-2025-mix-2-in-the-club&auto_play=false">
        </iframe>
    </div>

    <script>
        let isMusicPlaying = false;

        window.onload = function() {
            const savedName = localStorage.getItem('room3_leadName') || "Jhonny";
            document.getElementById('display-name').value = savedName;
            document.getElementById('badge-name').innerText = savedName;
            document.getElementById('meet-code').value = localStorage.getItem('room3_meetCode') || "";
            document.getElementById('myc-ref').value = localStorage.getItem('room3_company_link') || "";
            updatePersonalLink();
        };

        function toggleStudioMusic() {
            const widget = SC.Widget(document.getElementById('sc-widget'));
            const btn = document.getElementById('m-btn-circle');
            if (!isMusicPlaying) { 
                widget.play(); 
                btn.innerText = "🎧"; 
                isMusicPlaying = true; 
            } else { 
                widget.pause(); 
                btn.innerText = "🎵"; 
                isMusicPlaying = false; 
            }
        }

        function saveProfile() {
            localStorage.setItem('room3_leadName', document.getElementById('display-name').value);
            localStorage.setItem('room3_company_link', document.getElementById('myc-ref').value);
            localStorage.setItem('room3_meetCode', document.getElementById('meet-code').value);
            const btn = document.getElementById('save-btn');
            btn.innerText = "GESPEICHERT!";
            setTimeout(() => { btn.innerText = "PROFIL SPEICHERN"; }, 2000);
            updatePersonalLink();
        }

        function updatePersonalLink() {
            const name = document.getElementById('display-name').value || "User";
            const mycRaw = document.getElementById('myc-ref').value.trim();
            let encodedMyc = mycRaw ? btoa(mycRaw) : "";
            const cleanName = name.replace(/\s+/g, '').toLowerCase();
            document.getElementById('personal-url').value = "https://room-3.live?ref=" + cleanName + (encodedMyc ? "&cid=" + encodedMyc : "");
            document.getElementById('badge-name').innerText = name;
        }

        function startMeeting() { window.open(document.getElementById('meet-code').value, '_blank'); }
        function copyMeetLink() { 
            navigator.clipboard.writeText(document.getElementById('meet-code').value);
            document.getElementById('copy-meet-btn').innerText = "KOPIERT!";
            setTimeout(() => document.getElementById('copy-meet-btn').innerText = "LINK KOPIEREN", 2000);
        }
        function copyPersonalLink() { 
            navigator.clipboard.writeText(document.getElementById('personal-url').value);
            document.getElementById('copy-marketing-btn').innerText = "KOPIERT!";
            setTimeout(() => document.getElementById('copy-marketing-btn').innerText = "LINK KOPIEREN", 2000);
        }
    </script>

    <script type="text/javascript">
        function googleTranslateElementInit() { 
            new google.translate.TranslateElement({ 
                pageLanguage: 'de', 
                includedLanguages: 'de,en,fr,it,es,tr,el,pl,pt',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE, 
                multilanguagePage: true 
            }, 'google_translate_element'); 
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
