<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Room 3 STUDIO | Dein Kontrollzentrum</title>

    <link rel="icon" type="image/png" href="room3logo.png">

    <script src="https://w.soundcloud.com/player/api.js" type="text/javascript"></script>

    <style>
        :root {
            --primary-gold: #d4af37;
            --room3-red: #a32438;
            --cyan-glow: #00f2ff;
            --bg-black: #050505;
            --glass-bg: rgba(5, 5, 5, 0.35); 
            --border-gold: rgba(212, 175, 55, 0.3);
        }

        /* --- GOOGLE TRANSLATE OPTIK & FIX (AUS VIP-LOGIK) --- */
        #google_translate_element {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 10001;
            background: rgba(0,0,0,0.6);
            padding: 5px;
            border-radius: 4px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* Verstecke Google Banner, Branding und Tooltips - EXAKT WIE VIP */
        .goog-te-banner-frame.skiptranslate, .goog-te-gadget-icon, .goog-te-banner-frame {
            display: none !important;
        }
        
        body { 
            top: 0 !important; 
            position: static !important;
        }

        .goog-tooltip { display: none !important; }
        .goog-tooltip:hover { display: none !important; }
        .goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
        
        .goog-te-gadget {
            color: transparent !important;
            font-size: 0 !important;
        }

        .goog-te-gadget .goog-te-combo {
            color: #fff !important;
            background: #222 !important;
            border: 1px solid var(--primary-gold) !important;
            padding: 8px !important;
            font-size: 13px !important;
            border-radius: 4px;
        }

        /* --- BASIS LAYOUT --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; 
            position: fixed;
            background-color: var(--bg-black);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .studio-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.2)), 
                        url("studio.png") no-repeat center center/cover;
            z-index: -1;
        }

        header {
            text-align: center;
            padding-top: 60px;
            width: 100%;
            z-index: 10;
            position: relative;
        }

        .studio-logo-small {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 120px;
            height: auto;
            z-index: 100;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
        }

        header h1 {
            font-size: 3.5rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            font-weight: 900;
            text-shadow: 0 0 30px rgba(0,0,0,1);
        }

        header h1 span {
            color: var(--primary-gold);
        }

        .subtitle {
            font-size: 1rem;
            letter-spacing: 5px;
            opacity: 0.9;
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* DASHBOARD GRID */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1300px;
            padding: 30px 20px;
            margin-top: 10px;
        }

        .control-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-gold);
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            transition: transform 0.4s ease;
            position: relative;
        }

        .card-icon {
            font-size: 2.2rem;
            color: var(--primary-gold);
            margin-bottom: 20px;
        }

        .control-card h3 {
            font-size: 1.6rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .control-card h3 span {
            color: var(--primary-gold);
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .studio-input {
            width: 100%;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 18px;
            border-radius: 15px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .btn-gold {
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 20px;
            border-radius: 18px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            width: 100%;
            margin-bottom: 18px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-outline {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 18px;
            border-radius: 18px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        /* --- MUSIK BUTTON UNTEN RECHTS (RUND) --- */
        .music-start-btn {
            position: fixed;
            bottom: 30px;
            right: 30px; 
            z-index: 9999;
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .music-start-btn:hover {
            background: var(--primary-gold);
            color: #000;
            transform: scale(1.05);
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 18px;
            border-radius: 40px;
            color: #ff4d4d;
            font-size: 0.85rem;
            font-weight: 900;
        }

        .dot {
            height: 12px;
            width: 12px;
            background-color: #ff4d4d;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(255, 77, 77, 0); }
            100% { transform: scale(0.95); }
        }

        .sponsor-badge {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-gold);
            padding: 15px 30px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 9998;
        }

        #sc-player-container {
            display: none; 
            visibility: hidden;
            height: 0;
            width: 0;
            overflow: hidden;
        }

        @media (max-width: 1024px) {
            header h1 { font-size: 2.5rem; }
            .dashboard-grid { grid-template-columns: 1fr; overflow-y: auto; height: 70vh; }
            .music-start-btn { bottom: 20px; right: 20px; padding: 10px 20px; font-size: 0.7rem; }
            .sponsor-badge { bottom: 20px; left: 20px; padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <img src="room3logo.png" alt="Room 3 Logo" class="studio-logo-small">

    <button class="music-start-btn" id="m-btn" onclick="toggleStudioMusic()">🎵 Musik starten</button>

    <div id="google_translate_element"></div>

    <div class="studio-background"></div>

    <header>
        <h1>Room 3 <span>Studio</span></h1>
        <p class="subtitle">WILLKOMMEN IN DEINER ZENTRALE</p>
    </header>

    <div class="dashboard-grid">
        
        <div class="control-card">
            <div class="card-icon">📡</div>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
                <h3>Elite Meet <span>Zentrale</span></h3>
                <div class="live-indicator" id="live-status">
                    <span class="dot"></span> STANDBY
                </div>
            </div>
            <div class="input-group">
                <label>DEIN GOOGLE MEET LINK</label>
                <input type="text" id="meet-code" class="studio-input" placeholder="https://meet.google.com/xxx-xxxx-xxx">
            </div>
            <button class="btn-gold" onclick="startMeeting()">MEINEN RAUM STARTEN</button>
            <button class="btn-outline" id="copy-meet-btn" onclick="copyMeetLink()">LINK KOPIEREN</button>
        </div>

        <div class="control-card">
            <div class="card-icon">👤</div>
            <h3>Sponsor <span>Profil</span></h3>
            <div class="input-group">
                <label>DEIN ÖFFENTLICHER NAME</label>
                <input type="text" id="display-name" class="studio-input" placeholder="Jhonny" oninput="updatePersonalLink();">
            </div>
            <div class="input-group">
                <label>DEIN MYCOINTAINER REF-LINK</label>
                <input type="text" id="myc-ref" class="studio-input" placeholder="https://..." oninput="updatePersonalLink();">
            </div>
            <button class="btn-gold" id="save-btn" onclick="saveProfile()">PROFIL SICHERN</button>
        </div>

        <div class="control-card">
            <div class="card-icon">🚀</div>
            <h3>Marketing <span>Link</span></h3>
            <div class="input-group">
                <label>DEIN PERSONALISIERTER LINK</label>
                <input type="text" id="personal-url" class="studio-input" readonly style="color: var(--primary-gold); font-weight: bold;">
            </div>
            <button class="btn-outline" id="copy-marketing-btn" onclick="copyPersonalLink()">LINK KOPIEREN</button>
        </div>

    </div>

    <div id="sc-player-container">
        <iframe id="sc-widget" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" 
            src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/astateoftrance/a-state-of-trance-2025-mix-2-in-the-club&color=%23d4af37&inverse=false&auto_play=false&show_user=true">
        </iframe>
    </div>

    <div class="sponsor-badge">
        <div style="width: 15px; height: 15px; background: #00ff41; border-radius: 50%; box-shadow: 0 0 10px #00ff41;"></div>
        <div>
            <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--primary-gold); display: block; font-weight: 900;">Team</span>
            <span id="badge-name" style="font-weight: bold; color: #fff; font-size: 1.2rem;">Jhonny</span>
        </div>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'de',
                includedLanguages: 'de,en,fr,it,es,tr,el,pl,pt',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        let isMusicPlaying = false;

        window.onload = function() {
            const savedName = localStorage.getItem('room3_leadName') || "Jhonny";
            const savedMeet = localStorage.getItem('room3_meetCode') || "";
            const savedMyC = localStorage.getItem('room3_company_link') || "";

            document.getElementById('display-name').value = savedName;
            document.getElementById('badge-name').innerText = savedName;
            if(savedMeet) document.getElementById('meet-code').value = savedMeet;
            if(savedMyC) document.getElementById('myc-ref').value = savedMyC;

            updatePersonalLink();
        };

        function toggleStudioMusic() {
            const widget = SC.Widget(document.getElementById('sc-widget'));
            const btn = document.getElementById('m-btn');
            
            if (!isMusicPlaying) {
                widget.play();
                btn.innerText = "🎧 Musik läuft";
                btn.style.borderColor = "#00ff41";
                btn.style.color = "#00ff41";
                isMusicPlaying = true;
            } else {
                widget.pause();
                btn.innerText = "🎵 Musik starten";
                btn.style.borderColor = "var(--primary-gold)";
                btn.style.color = "var(--primary-gold)";
                isMusicPlaying = false;
            }
        }

        function saveProfile() {
            localStorage.setItem('room3_leadName', document.getElementById('display-name').value);
            localStorage.setItem('room3_company_link', document.getElementById('myc-ref').value);
            localStorage.setItem('room3_meetCode', document.getElementById('meet-code').value);
            const btn = document.getElementById('save-btn');
            btn.innerText = "GESICHERT!";
            setTimeout(() => btn.innerText = "PROFIL SICHERN", 2000);
            updatePersonalLink();
        }

        function updatePersonalLink() {
            const name = document.getElementById('display-name').value || "User";
            const cleanName = name.replace(/\s+/g, '').toLowerCase();
            const mycRaw = document.getElementById('myc-ref').value.trim();
            let encodedMyc = mycRaw ? btoa(mycRaw) : "";
            let finalUrl = "https://room-3.live?ref=" + cleanName + (encodedMyc ? "&cid=" + encodedMyc : "");
            document.getElementById('personal-url').value = finalUrl;
            document.getElementById('badge-name').innerText = name;
        }

        function startMeeting() {
            const link = document.getElementById('meet-code').value;
            if(link) window.open(link, '_blank');
        }

        function copyMeetLink() {
            const field = document.getElementById('meet-code');
            field.select();
            document.execCommand("copy");
            window.getSelection().removeAllRanges();
            const btn = document.getElementById('copy-meet-btn');
            btn.innerText = "KOPIERT!";
            setTimeout(() => btn.innerText = "LINK KOPIEREN", 2000);
        }

        function copyPersonalLink() {
            const field = document.getElementById('personal-url');
            field.select();
            document.execCommand("copy");
            window.getSelection().removeAllRanges();
            const btn = document.getElementById('copy-marketing-btn');
            btn.innerText = "KOPIERT!";
            setTimeout(() => btn.innerText = "LINK KOPIEREN", 2000);
        }
    </script>
</body>
</html>
