<!DOCTYPE html>
<html>
<head>

    <style>

        }

        }
        
        body { 
            top: 0px !important; 
            position: static !important; 
            padding-top: 0 !important;
            margin-top: 0 !important;
        }

        .goog-te-banner-frame, 
        .goog-te-banner,

        iframe[id*=':1.container'],
        iframe[id*=':2.container'] {
            display: none !important;

        .goog-te-gadget-simple {

        /* --- STUDIO LAYOUT --- */
        section#main-studio {

            background: url('studio.png') no-repeat center center / cover;

        }

        header {
            text-align: center;
            padding: 45px 20px 0px;

        }

        header h1 {

            letter-spacing: 12px;
            text-transform: uppercase;

            text-shadow: 0 5px 30px rgba(0,0,0,1);

        .white-text { color: #ffffff !important; }
        .gold-text { color: var(--primary-gold) !important; }

        .subtitle {
            font-size: 2.2rem;

            text-transform: uppercase;
            color: #000000;

        }

        /* --- REAKTOR BEREICH MIT FLÜSSIG-GOLD ZAHL --- */
        .reaktor-center {
            position: absolute;
            top: 62%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
        }

        .reaktor-label {
            font-size: 1.4rem;
            letter-spacing: 8px;
            color: #000000;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 8px;
            text-shadow: 1px 1px 0px #fff, -1px -1px 0px #fff, 1px -1px 0px #fff, -1px 1px 0px #fff;
            font-style: italic;
        }

        .reaktor-count-wrapper {
            position: relative;
            display: inline-block;
        }

        .reaktor-count {
            font-size: 13rem;
            font-weight: 950;
            font-family: 'Arial Black', Gadget, sans-serif;
            background: linear-gradient(
                to bottom, 
                #8a6d3b 0%, 
                #d4af37 22%, 
                #fff9ab 45%, 
                #ffcc00 50%, 
                #d4af37 55%, 
                #8a6d3b 78%, 
                #5e4c25 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 0px rgba(0,0,0,0.8)) 
                    drop-shadow(0 15px 30px rgba(0,0,0,1));
            line-height: 0.9;
            position: relative;
            z-index: 1;
        }

        .reaktor-count::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                115deg, 
                transparent 0%, 
                transparent 40%, 
                rgba(255, 249, 171, 0.8) 50%, 
                transparent 60%, 
                transparent 100%
            );
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine-gold 4s infinite linear;
            z-index: 2;
        }

        @keyframes shine-gold {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .count-update-flash {
            animation: ultimate-gold-flash 0.8s ease-out forwards;
        }

        @keyframes ultimate-gold-flash {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.1); filter: brightness(1.5) drop-shadow(0 0 40px #fff9ab); }
            100% { transform: scale(1); filter: brightness(1); }

            padding: 12px;
            border-radius: 20px;
            margin-bottom: 12px;

        }

        .premium-buzzer-box .label {
            font-size: 0.55rem;

            text-transform: uppercase;

        .premium-buzzer-box .project-name {

            color: var(--primary-gold);
            display: block;
            margin-bottom: 8px;

        }

        .gold-buzzer-btn {
            display: block;

            color: #000;
            padding: 10px;
            border-radius: 10px;

            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;

        }

        .card-icon { font-size: 1.8rem; color: var(--primary-gold); margin-bottom: 15px; }

        .control-card h3 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;

        }

        .status-box {

            align-items: center;

            margin-bottom: 15px;
            padding: 6px 15px;
            border-radius: 12px;

        .status-dot { width: 10px; height: 10px; border-radius: 50%; animation: pulse-status 2s infinite; }
        .dot-red { background: var(--status-red); box-shadow: 0 0 15px var(--status-red); }
        .dot-yellow { background: var(--status-yellow); box-shadow: 0 0 15px var(--status-yellow); }
        .dot-green { background: var(--status-green); box-shadow: 0 0 15px var(--status-green); }

        .status-label { font-size: 0.7rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        .text-red { color: var(--status-red); }
        .text-yellow { color: var(--status-yellow); }
        .text-green { color: var(--status-green); }

            background: var(--primary-gold);

            border: none;
            padding: 15px;
            border-radius: 15px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            margin-bottom: 8px;
        }

        .btn-stop {
            background: #ff8c00;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;

        .btn-outline {
            background: transparent;

            padding: 12px;
            border-radius: 15px;
            cursor: pointer;

        }

        .sponsor-badge-floating {
            position: fixed;
            bottom: 25px;
            left: 25px; 
            background: rgba(0,0,0,0.9);
            border: 1px solid var(--border-gold);
            padding: 12px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100 !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .control-cluster-right {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 100;

        .btn-exit-studio {

            padding: 0 30px;
            background: rgba(0,0,0,0.9);
            border: 2px solid var(--primary-gold);
            border-radius: 50px;

        .music-btn-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0,0,0,0.9);
            border: 2px solid var(--primary-gold);

        #big-popup {

            left: 50%;

            width: 450px;

            border: 2px solid var(--primary-gold);

            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;

        #big-popup.active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 999999; }
        .popup-overlay.active { display: block; }
        .btn-popup-close { background: var(--primary-gold); color: #000; border: none; padding: 20px; border-radius: 20px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; width: 100%; margin-top: 30px; }

        #sc-widget-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            left: -10000px;
            overflow: hidden;
        }

    </style>
</head>
<body>

    <div class="popup-overlay" id="overlay" onclick="closePopup()"></div>
    <div id="big-popup">

    <div class="studio-logo-fixed"></div>

    <section id="main-studio">
        
        <div id="google_translate_element"></div>

        <header>

                    <span class="label">DEIN EXKLUSIVER ZUGANG ZUM BACKOFFICE VON:</span>
                    <span class="project-name" id="project-display-name">MUSTERKOMPANIE</span>
                    <a href="#" id="sponsor-link-btn" class="gold-buzzer-btn" target="_blank">HIER KLICKEN & STARTEN</a>
                </div>
                <div class="input-group">
                    <label>1. DEIN ÖFFENTLICHER NAME</label>
                    <input type="text" id="display-name" class="studio-input" placeholder="Name" oninput="updatePersonalLink()">
                </div>
                <div class="input-group">
                    <label>2. DEIN COMPANY REF-LINK</label>
                    <input type="text" id="myc-ref" class="studio-input" placeholder="https://..." oninput="updatePersonalLink()">
                </div>
                <div class="input-group">
                    <label>3. DEIN ROOM 3 MARKETING-LINK</label>
                    <input type="text" id="personal-url" class="studio-input" readonly style="color: var(--primary-gold); border-color: var(--primary-gold);">
                </div>
                <button class="btn-gold" onclick="saveProfileManually()">PROFIL SPEICHERN</button>
                <button class="btn-outline" onclick="copyToClipboard('personal-url', 'copy-marketing-btn', 'MARKETING LINK KOPIERT', 'BEREIT ZUM VERSCHICKEN')">MARKETING LINK KOPIEREN</button>
            </div>

        </div>

        <div class="sponsor-badge-floating">
            <div id="badge-dot" style="width: 12px; height: 12px; border-radius: 50%; background: var(--status-red);"></div>
            <div>
                <span id="badge-status-label" style="font-size: 0.6rem; color: var(--primary-gold); display: block; font-weight: 900;">STATUS: STANDBY</span>
                <span id="badge-name">Laden...</span>
            </div>
        </div>

        <div class="control-cluster-right">
            <a href="index.html" class="btn-exit-studio">

    <div id="sc-widget-hidden">
        <iframe id="sc-widget" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" 
            src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/astateoftrance/a-state-of-trance-2025-mix-2-in-the-club&auto_play=false&show_artwork=false&visual=false">
        </iframe>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD_CBo-q85-OC5WjSr-2MwaBybMCOde0R8",
            authDomain: "room-3-the-international.firebaseapp.com",
            databaseURL: "https://room-3-the-international-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "room-3-the-international",
            storageBucket: "room-3-the-international.firebasestorage.app",
            messagingSenderId: "823235896788",
            appId: "1:823235896788:web:bff060409e3f8c9bb2e241"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        let isMusicPlaying = false;
        let sessionLive = false;
        let meetWindow = null;
        let saveTimeout;
        let syncCheck = null;

        function animateStudioCounter(targetValue) {
            const el = document.getElementById('partner-count-display');
            const duration = 2500; 
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeOut = 1 - Math.pow(1 - progress, 5);
                const currentValue = Math.floor(easeOut * targetValue);
                
                el.innerText = currentValue;
                el.setAttribute('data-text', currentValue);

                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    el.innerText = targetValue;
                    el.setAttribute('data-text', targetValue);
                    el.classList.add('count-update-flash');
                    initTranslateQuietly();
                }
            }
            requestAnimationFrame(update);
        }

        function initTranslateQuietly() {
            if (typeof googleTranslateElementInit === 'function') {
                const script = document.createElement('script');
                script.type = 'text/javascript';
                script.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
                document.body.appendChild(script);
            }
        }

        window.onload = function() {
            document.getElementById('display-name').value = localStorage.getItem('room3_leadName') || "";
            document.getElementById('meet-code').value = localStorage.getItem('room3_meetCode') || "";
            document.getElementById('myc-ref').value = localStorage.getItem('room3_company_link') || "";
            updatePersonalLink();
            refreshStatus();

            setTimeout(() => {
                animateStudioCounter(337);
            }, 800);

            const observer = new MutationObserver(() => {
                if (document.body.style.top !== "0px") document.body.style.top = "0px";
                if (document.documentElement.style.paddingTop !== "0px") document.documentElement.style.paddingTop = "0px";
            });
            observer.observe(document.documentElement, { attributes: true, childList: true, subtree: true });
        };

        function showBigPopup(title, text) {
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-text').innerText = text;
            document.getElementById('overlay').classList.add('active');
            document.getElementById('big-popup').classList.add('active');
        }

        function closePopup() {
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('big-popup').classList.remove('active');
        }

        function autoSaveLink() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem('room3_meetCode', document.getElementById('meet-code').value.trim());
                refreshStatus();
            }, 800);
        }

        function saveProfileManually() {
            localStorage.setItem('room3_leadName', document.getElementById('display-name').value);
            localStorage.setItem('room3_company_link', document.getElementById('myc-ref').value);
            updatePersonalLink();
            showBigPopup("VIELEN DANK", "DATEN WURDEN GESPEICHERT");
        }

        function sendGlobalBroadcast() {
            const msg = document.getElementById('broadcast-message').value.trim();
            const senderName = document.getElementById('display-name').value || "Moderator";

            if(!msg) return showBigPopup("FEHLER", "BITTE NACHRICHT EINGEBEN");
            
            database.ref('globalBroadcast').set({
                message: msg,
                sender: senderName,
                timestamp: Date.now()
            }).then(() => {
                showBigPopup("BROADCAST", "PUSH-SIGNAL AN ALLE PARTNER GESENDET");
                document.getElementById('broadcast-message').value = "";
            }).catch((error) => {
                showBigPopup("FEHLER", "DATENBANK-VERBINDUNG FEHLGESCHLAGEN");
                console.error("Firebase Error:", error);
            });
        }

        function refreshStatus() {
            if (sessionLive) return;
            const code = document.getElementById('meet-code').value.trim();
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            const bDot = document.getElementById('badge-dot');
            const bLbl = document.getElementById('badge-status-label');

            if (code.length > 5) {
                dot.className = "status-dot dot-yellow";
                txt.innerText = "BEREIT ZUM STARTEN";
                txt.className = "status-label text-yellow";
                bDot.style.background = "var(--status-yellow)";
                bLbl.innerText = "STATUS: BEREIT";
            } else {
                dot.className = "status-dot dot-red";
                txt.innerText = "STANDBY";
                txt.className = "status-label text-red";
                bDot.style.background = "var(--status-red)";
                bLbl.innerText = "STATUS: STANDBY";
            }
        }

        function startMeeting() {
            const link = document.getElementById('meet-code').value.trim();
            if(!link) return;
            const widget = SC.Widget(document.getElementById('sc-widget'));
            widget.pause();
            isMusicPlaying = false;
            document.getElementById('m-btn-studio').innerText = "🎵";
            sessionLive = true;
            document.getElementById('status-dot').className = "status-dot dot-green";
            document.getElementById('status-text').innerText = "DU BIST LIVE";
            document.getElementById('status-text').className = "status-label text-green";
            document.getElementById('badge-dot').style.background = "var(--status-green)";
            document.getElementById('badge-status-label').innerText = "STATUS: LIVE";
            document.getElementById('start-btn').style.display = "none";
            document.getElementById('stop-btn').style.display = "block";
            meetWindow = window.open(link, '_blank');
            if (syncCheck) clearInterval(syncCheck);
            syncCheck = setInterval(() => {
                if (!meetWindow || meetWindow.closed) {
                    stopMeeting();
                }
            }, 500);
        }

        function stopMeeting() {
            sessionLive = false;
            if (syncCheck) clearInterval(syncCheck);
            if (meetWindow && !meetWindow.closed) meetWindow.close();
            document.getElementById('start-btn').style.display = "block";
            document.getElementById('stop-btn').style.display = "none";
            refreshStatus();
        }

        function toggleStudioMusic() {
            const widget = SC.Widget(document.getElementById('sc-widget'));
            const btn = document.getElementById('m-btn-studio');
            if (!isMusicPlaying) { 
                widget.play(); 
                isMusicPlaying = true; 
                btn.innerText = "🎧"; 
            } else { 
                widget.pause(); 
                isMusicPlaying = false; 
                btn.innerText = "🎵"; 
            }
        }

        function updatePersonalLink() {
            const name = document.getElementById('display-name').value || "User";
            const myc = document.getElementById('myc-ref').value.trim();
            const encoded = myc ? btoa(myc) : "";
            const currentPath = window.location.href.split('studio.html')[0];
            const fullLink = currentPath + "index.html?ref=" + encodeURIComponent(name) + (encoded ? "&cid="+encoded : "");
            document.getElementById('personal-url').value = fullLink;
            document.getElementById('badge-name').innerText = name;
            document.getElementById('sponsor-link-btn').href = myc || "#";
        }

        function copyToClipboard(inputId, buttonId, popupTitle, popupMsg) {
            const copyText = document.getElementById(inputId);
            navigator.clipboard.writeText(copyText.value).then(() => {
                showBigPopup(popupTitle, popupMsg);
            });
        }

        function googleTranslateElementInit() { 
            new google.translate.TranslateElement({ 
                pageLanguage: 'de', 
                includedLanguages: 'de,en,el,fr,it,es,tr,pl,pt',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element'); 
        }
    </script>
</body>
</html>
