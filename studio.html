<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title class="skiptranslate">Room 3 STUDIO | Dein Kontrollzentrum</title>

    <link rel="icon" type="image/png" href="room3logo.png">
    
    <script src="https://w.soundcloud.com/player/api.js" type="text/javascript"></script>

    <style>
        :root {
            --primary-gold: #d4af37;
            --glass-bg: rgba(5, 5, 5, 0.75); 
            --border-gold: rgba(212, 175, 55, 0.4);
            --status-red: #ff4b2b;
            --status-orange: #ffa500;
            --status-green: #00ff41;
        }

        /* --- GOOGLE TRANSLATE BANNER KILLER --- */
        .goog-te-banner-frame.skiptranslate,
        .goog-te-banner-frame,
        .goog-te-banner,
        .goog-te-balloon-frame,
        #goog-gt-tt,
        .VIpgJd-Zvi9ab-OR9sP-bgnd,
        iframe[id^=":1.container"],
        iframe[id^=":2.container"],
        .goog-tooltip,
        .goog-tooltip:hover {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            height: 0 !important;
        }

        body {
            top: 0px !important; 
            position: static !important;
        }

        #google_translate_element select.goog-te-combo {
            background: #000 !important;
            color: var(--primary-gold) !important;
            border: 1px solid var(--primary-gold) !important;
            border-radius: 20px !important;
            padding: 8px 12px !important;
            font-weight: bold !important;
            outline: none !important;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        section#main-studio {
            width: 100%;
            min-height: 100vh;
            background: url('studio.png') no-repeat center center / cover;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (max-width: 768px) {
            section#main-studio {
                background: url('studiomobil.png') no-repeat center center / cover;
            }
        }

        .studio-logo-small {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 140px;
            z-index: 100;
        }

        header {
            text-align: center;
            padding: 90px 20px 30px;
            z-index: 10;
        }

        header h1 {
            font-size: 4rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            font-weight: 900;
            text-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        .white-text { color: #ffffff !important; }
        .gold-text { color: var(--primary-gold) !important; }

        .subtitle {
            font-size: 1rem;
            letter-spacing: 8px;
            opacity: 0.9;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 35px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 20px 120px;
            z-index: 5;
        }

        .control-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-gold);
            border-radius: 45px;
            padding: 45px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.8);
            transition: all 0.4s ease;
        }

        .card-icon {
            font-size: 2.5rem;
            color: var(--primary-gold);
            margin-bottom: 25px;
        }

        .control-card h3 {
            font-size: 1.7rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .status-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            padding: 10px 20px;
            border-radius: 15px;
            width: fit-content;
            background: rgba(0,0,0,0.3);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse-status 2s infinite;
        }

        .dot-red { background: var(--status-red); box-shadow: 0 0 15px var(--status-red); }
        .text-red { color: var(--status-red); }
        .dot-orange { background: var(--status-orange); box-shadow: 0 0 15px var(--status-orange); }
        .text-orange { color: var(--status-orange); }
        .dot-green { background: var(--status-green); box-shadow: 0 0 15px var(--status-green); }
        .text-green { color: var(--status-green); }

        @keyframes pulse-status { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .status-label { font-size: 0.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.8rem;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .studio-input {
            width: 100%;
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 18px;
            border-radius: 15px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
        }

        .btn-gold {
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn-outline {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 18px;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
        }

        .sc-player-fixed-right {
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 10000;
        }

        .music-btn-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(0,0,0,0.9);
            border: 3px solid var(--primary-gold);
            color: var(--primary-gold);
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .sponsor-badge-left {
            position: fixed;
            bottom: 40px;
            left: 40px;
            background: rgba(0,0,0,0.9);
            border: 1px solid var(--border-gold);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 9999;
        }

        #google_translate_element {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 10001;
        }

        #sc-widget-hidden { display: none; }

        @media (max-width: 1024px) {
            header h1 { font-size: 2.8rem; }
            .dashboard-grid { grid-template-columns: 1fr; padding: 20px; }
        }
    </style>
</head>
<body>

    <section id="main-studio">
        
        <img src="room3logo.png" alt="Logo" class="studio-logo-small skiptranslate">

        <div id="google_translate_element"></div>

        <header>
            <h1><span class="white-text skiptranslate">Room 3</span> <span class="gold-text">Studio</span></h1>
            <p class="subtitle">DEIN KONTROLLZENTRUM</p>
        </header>

        <div class="dashboard-grid">
            
            <div class="control-card">
                <div class="card-icon skiptranslate">📡</div>
                <div class="status-box" id="live-status-container">
                    <div id="status-dot" class="status-dot dot-red"></div>
                    <span id="status-text" class="status-label text-red">STANDBY</span>
                </div>
                <h3>Elite Meet <span>Zentrale</span></h3>
                <div class="input-group">
                    <label>DEIN GOOGLE MEET LINK</label>
                    <input type="text" id="meet-code" class="studio-input skiptranslate" placeholder="https://meet.google.com/..." oninput="checkInputStatus()">
                </div>
                <button class="btn-gold" id="start-btn" onclick="startMeeting()">MEINEN RAUM STARTEN</button>
                <button class="btn-outline" id="copy-meet-btn" onclick="copyMeetLink()">LINK KOPIEREN</button>
            </div>

            <div class="control-card">
                <div class="card-icon skiptranslate">👤</div>
                <h3>Sponsor <span>Profil</span></h3>
                <div class="input-group">
                    <label>DEIN ÖFFENTLICHER NAME</label>
                    <input type="text" id="display-name" class="studio-input skiptranslate" placeholder="Name" oninput="updatePersonalLink();">
                </div>
                <div class="input-group">
                    <label>MYCOINTAINER REF-LINK</label>
                    <input type="text" id="myc-ref" class="studio-input skiptranslate" placeholder="https://..." oninput="updatePersonalLink();">
                </div>
                <button class="btn-gold" id="save-btn" onclick="saveProfile()">PROFIL SPEICHERN</button>
            </div>

            <div class="control-card">
                <div class="card-icon skiptranslate">🚀</div>
                <h3>Marketing <span>Link</span></h3>
                <div class="input-group">
                    <label>DEIN PERSONALISIERTER LINK</label>
                    <input type="text" id="personal-url" class="studio-input skiptranslate" readonly style="color: var(--primary-gold); font-weight: bold;">
                </div>
                <button class="btn-outline" id="copy-marketing-btn" onclick="copyPersonalLink()">LINK KOPIEREN</button>
            </div>

        </div>

        <div class="sponsor-badge-left">
            <div id="badge-dot" style="width: 12px; height: 12px; border-radius: 50%; background: #ff4b2b;"></div>
            <div>
                <span style="font-size: 0.6rem; color: var(--primary-gold); display: block; font-weight: 900;">STATUS: AKTIV</span>
                <span id="badge-name" class="skiptranslate">Laden...</span>
            </div>
        </div>

        <div class="sc-player-fixed-right">
            <div class="music-btn-circle" id="m-btn-circle" onclick="toggleStudioMusic()">🎵</div>
        </div>

    </section>

    <div id="sc-widget-hidden">
        <iframe id="sc-widget" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" 
            src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/astateoftrance/a-state-of-trance-2025-mix-2-in-the-club&auto_play=false">
        </iframe>
    </div>

    <script>
        let isMusicPlaying = false;
        let sessionLive = false;

        window.onload = function() {
            const savedName = localStorage.getItem('room3_leadName') || "Jhonny";
            document.getElementById('display-name').value = savedName;
            document.getElementById('badge-name').innerText = savedName;
            document.getElementById('meet-code').value = localStorage.getItem('room3_meetCode') || "";
            document.getElementById('myc-ref').value = localStorage.getItem('room3_company_link') || "";
            updatePersonalLink();
            checkInputStatus();
        };

        function checkInputStatus() {
            if (sessionLive) return; // Wenn bereits live geklickt wurde, nichts ändern
            
            const meetCode = document.getElementById('meet-code').value.trim();
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            const bDot = document.getElementById('badge-dot');

            if (meetCode.length > 5) {
                dot.className = "status-dot dot-orange";
                txt.innerText = "BEREIT ZUM STARTEN";
                txt.className = "status-label text-orange";
                bDot.style.background = "#ffa500";
            } else {
                dot.className = "status-dot dot-red";
                txt.innerText = "STANDBY";
                txt.className = "status-label text-red";
                bDot.style.background = "#ff4b2b";
            }
        }

        function startMeeting() { 
            const link = document.getElementById('meet-code').value;
            if(link) {
                sessionLive = true;
                const dot = document.getElementById('status-dot');
                const txt = document.getElementById('status-text');
                const bDot = document.getElementById('badge-dot');
                
                dot.className = "status-dot dot-green";
                txt.innerText = "DU BIST LIVE";
                txt.className = "status-label text-green";
                bDot.style.background = "#00ff41";
                bDot.style.boxShadow = "0 0 15px #00ff41";

                window.open(link, '_blank');
            } else {
                alert("Bitte gib erst deinen Meet-Link ein!");
            }
        }

        function toggleStudioMusic() {
            const widget = SC.Widget(document.getElementById('sc-widget'));
            const btn = document.getElementById('m-btn-circle');
            if (!isMusicPlaying) { widget.play(); btn.innerText = "🎧"; isMusicPlaying = true; } 
            else { widget.pause(); btn.innerText = "🎵"; isMusicPlaying = false; }
        }

        function saveProfile() {
            localStorage.setItem('room3_leadName', document.getElementById('display-name').value);
            localStorage.setItem('room3_company_link', document.getElementById('myc-ref').value);
            localStorage.setItem('room3_meetCode', document.getElementById('meet-code').value);
            const btn = document.getElementById('save-btn');
            btn.innerText = "GESPEICHERT!";
            setTimeout(() => { btn.innerText = "PROFIL SPEICHERN"; }, 2000);
            updatePersonalLink();
            checkInputStatus();
        }

        function updatePersonalLink() {
            const name = document.getElementById('display-name').value || "User";
            const mycRaw = document.getElementById('myc-ref').value.trim();
            let encodedMyc = mycRaw ? btoa(mycRaw) : "";
            const cleanName = name.replace(/\s+/g, '').toLowerCase();
            document.getElementById('personal-url').value = "https://room-3.live?ref=" + cleanName + (encodedMyc ? "&cid=" + encodedMyc : "");
            document.getElementById('badge-name').innerText = name;
        }

        function copyMeetLink() { 
            navigator.clipboard.writeText(document.getElementById('meet-code').value);
            document.getElementById('copy-meet-btn').innerText = "KOPIERT!";
            setTimeout(() => document.getElementById('copy-meet-btn').innerText = "LINK KOPIEREN", 2000);
        }

        function copyPersonalLink() { 
            navigator.clipboard.writeText(document.getElementById('personal-url').value);
            document.getElementById('copy-marketing-btn').innerText = "KOPIERT!";
            setTimeout(() => document.getElementById('copy-marketing-btn').innerText = "LINK KOPIEREN", 2000);
        }
    </script>

    <script type="text/javascript">
        function googleTranslateElementInit() { 
            new google.translate.TranslateElement({ 
                pageLanguage: 'de', 
                includedLanguages: 'de,en,fr,it,es,tr,el,pl,pt',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE, 
                multilanguagePage: true 
            }, 'google_translate_element'); 
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
