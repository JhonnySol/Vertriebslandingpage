<!DOCTYPE html>
<html lang="de" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Room 3 STUDIO | Dein Kontrollzentrum</title>

    <link rel="icon" type="image/png" href="room3logo.png">

    <script src="https://w.soundcloud.com/player/api.js" type="text/javascript"></script>

    <style>
        :root {
            --primary-gold: #d4af37;
            --room3-red: #a32438;
            --cyan-glow: #00f2ff;
            --bg-black: #050505;
            --glass-bg: rgba(5, 5, 5, 0.45); 
            --border-gold: rgba(212, 175, 55, 0.3);
        }

        /* --- STRIKTE TRANSLATE CSS GEGEN DIE X-LEISTE --- */
        iframe.goog-te-banner-frame {
            display: none !important;
            visibility: hidden !important;
        }

        .goog-te-banner-frame.skiptranslate {
            display: none !important;
            visibility: hidden !important;
        }

        #goog-gt-tt, .goog-te-balloon-frame, .goog-te-gadget-icon {
            display: none !important;
            visibility: hidden !important;
        }

        .goog-te-banner {
            display: none !important;
            visibility: hidden !important;
        }

        body {
            top: 0px !important; 
            position: static !important;
        }

        .goog-tooltip, .goog-tooltip:hover {
            display: none !important;
        }

        .goog-text-highlight {
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* Styling des Dropdowns passend zum Room 3 Design */
        .goog-te-gadget .goog-te-combo {
            margin: 0 !important;
            padding: 10px 15px !important;
            background: #000 !important;
            color: var(--primary-gold) !important;
            border: 1px solid var(--primary-gold) !important;
            border-radius: 30px !important;
            font-weight: bold !important;
            outline: none !important;
        }

        /* --- BASIS LAYOUT --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* HINTERGRUND EBENE MIT MOBIL-WECHSEL */
        .studio-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .studio-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .studio-logo-small {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 130px;
            z-index: 100;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.2));
        }

        header {
            text-align: center;
            padding: 70px 20px 30px;
            z-index: 10;
            position: relative;
        }

        header h1 {
            font-size: 3.8rem;
            letter-spacing: 15px;
            text-transform: uppercase;
            font-weight: 900;
            text-shadow: 0 5px 25px rgba(0,0,0,0.8);
        }

        header h1 span {
            color: var(--primary-gold);
        }

        .subtitle {
            font-size: 1.1rem;
            letter-spacing: 6px;
            opacity: 0.8;
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* DASHBOARD GRID */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 40px;
            width: 100%;
            max-width: 1350px;
            margin: 0 auto;
            padding: 30px;
            position: relative;
            z-index: 5;
        }

        .control-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-gold);
            border-radius: 40px;
            padding: 45px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.6);
            transition: all 0.4s ease;
        }

        .control-card:hover {
            border-color: var(--primary-gold);
            transform: translateY(-5px);
        }

        .card-icon {
            font-size: 2.2rem;
            color: var(--primary-gold);
            margin-bottom: 20px;
        }

        .control-card h3 {
            font-size: 1.7rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .control-card h3 span {
            color: var(--primary-gold);
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .studio-input {
            width: 100%;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 18px;
            border-radius: 18px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .studio-input:focus {
            border-color: var(--primary-gold);
        }

        .btn-gold {
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 22px;
            border-radius: 20px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            width: 100%;
            margin-bottom: 18px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-gold:hover {
            background: #fff;
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 18px;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn-outline:hover {
            border-color: #fff;
        }

        /* --- MUSIK PLAYER BUTTON UNTEN RECHTS --- */
        .music-start-btn {
            position: fixed;
            bottom: 40px;
            right: 40px; 
            z-index: 10000;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 18px 35px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.4s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .music-start-btn:hover {
            background: var(--primary-gold);
            color: #000;
            transform: translateY(-5px);
        }

        /* SPONSOR BADGE UNTEN LINKS */
        .sponsor-badge {
            position: fixed;
            bottom: 40px;
            left: 40px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-gold);
            padding: 18px 35px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 9999;
        }

        .live-indicator-dot {
            width: 15px;
            height: 15px;
            background: #00ff41;
            border-radius: 50%;
            box-shadow: 0 0 15px #00ff41;
        }

        #badge-name {
            font-weight: bold;
            color: #fff;
            font-size: 1.2rem;
        }

        /* GOOGLE TRANSLATE POSITION */
        #google_translate_element {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 10001;
        }

        #sc-player-container {
            display: none;
            visibility: hidden;
        }

        @media (max-width: 1024px) {
            header h1 { font-size: 2.5rem; letter-spacing: 8px; }
            .dashboard-grid { grid-template-columns: 1fr; overflow-y: auto; height: 70vh; padding: 15px; }
            .music-start-btn { bottom: 20px; right: 20px; padding: 12px 25px; font-size: 0.75rem; }
            .sponsor-badge { bottom: 20px; left: 20px; padding: 12px 25px; }
            .studio-logo-small { width: 100px; top: 15px; left: 15px; }
        }
    </style>
</head>
<body>

    <div class="studio-background">
        <picture>
            <source srcset="studiomobil.png" media="(max-width: 768px)">
            <img src="studio.png" alt="Studio Background">
        </picture>
    </div>
    
    <img src="room3logo.png" alt="Room 3 Logo" class="studio-logo-small">

    <div id="google_translate_element"></div>

    <button class="music-start-btn" id="m-btn" onclick="toggleStudioMusic()">🎵 Musik starten</button>

    <header>
        <h1>Room 3 <span>Studio</span></h1>
        <p class="subtitle">DEIN KONTROLLZENTRUM</p>
    </header>

    <div class="dashboard-grid">
        
        <div class="control-card">
            <div class="card-icon">📡</div>
            <h3>Elite Meet <span>Zentrale</span></h3>
            <div class="input-group">
                <label>DEIN GOOGLE MEET LINK</label>
                <input type="text" id="meet-code" class="studio-input" placeholder="https://meet.google.com/xxx-xxxx-xxx">
            </div>
            <button class="btn-gold" onclick="startMeeting()">MEINEN RAUM STARTEN</button>
            <button class="btn-outline" id="copy-meet-btn" onclick="copyMeetLink()">LINK KOPIEREN</button>
        </div>

        <div class="control-card">
            <div class="card-icon">👤</div>
            <h3>Sponsor <span>Profil</span></h3>
            <div class="input-group">
                <label>DEIN ÖFFENTLICHER NAME</label>
                <input type="text" id="display-name" class="studio-input" placeholder="Name eingeben" oninput="updatePersonalLink();">
            </div>
            <div class="input-group">
                <label>DEIN MYCOINTAINER REF-LINK</label>
                <input type="text" id="myc-ref" class="studio-input" placeholder="https://..." oninput="updatePersonalLink();">
            </div>
            <button class="btn-gold" id="save-btn" onclick="saveProfile()">PROFIL SPEICHERN</button>
        </div>

        <div class="control-card">
            <div class="card-icon">🚀</div>
            <h3>Marketing <span>Link</span></h3>
            <div class="input-group">
                <label>DEIN PERSONALISIERTER LINK</label>
                <input type="text" id="personal-url" class="studio-input" readonly style="color: var(--primary-gold); font-weight: bold;">
            </div>
            <button class="btn-outline" id="copy-marketing-btn" onclick="copyPersonalLink()">LINK KOPIEREN</button>
        </div>

    </div>

    <div class="sponsor-badge">
        <div class="live-indicator-dot"></div>
        <div>
            <span style="font-size: 0.7rem; text-transform: uppercase; color: var(--primary-gold); display: block; font-weight: 900; letter-spacing: 1px;">Sponsor</span>
            <span id="badge-name">Laden...</span>
        </div>
    </div>

    <div id="sc-player-container">
        <iframe id="sc-widget" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" 
            src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/astateoftrance/a-state-of-trance-2025-mix-2-in-the-club&color=%23d4af37&auto_play=false">
        </iframe>
    </div>

    <script>
        let isMusicPlaying = false;

        // DATEN LADEN BEIM START
        window.onload = function() {
            const savedName = localStorage.getItem('room3_leadName') || "Jhonny";
            const savedMeet = localStorage.getItem('room3_meetCode') || "";
            const savedMyC = localStorage.getItem('room3_company_link') || "";

            document.getElementById('display-name').value = savedName;
            document.getElementById('badge-name').innerText = savedName;
            if(savedMeet) document.getElementById('meet-code').value = savedMeet;
            if(savedMyC) document.getElementById('myc-ref').value = savedMyC;

            updatePersonalLink();
        };

        function toggleStudioMusic() {
            const widget = SC.Widget(document.getElementById('sc-widget'));
            const btn = document.getElementById('m-btn');
            
            if (!isMusicPlaying) {
                widget.play();
                btn.innerText = "🎧 Musik läuft";
                btn.style.borderColor = "#00ff41";
                btn.style.color = "#00ff41";
                isMusicPlaying = true;
            } else {
                widget.pause();
                btn.innerText = "🎵 Musik starten";
                btn.style.borderColor = "var(--primary-gold)";
                btn.style.color = "var(--primary-gold)";
                isMusicPlaying = false;
            }
        }

        function saveProfile() {
            localStorage.setItem('room3_leadName', document.getElementById('display-name').value);
            localStorage.setItem('room3_company_link', document.getElementById('myc-ref').value);
            localStorage.setItem('room3_meetCode', document.getElementById('meet-code').value);
            const btn = document.getElementById('save-btn');
            btn.innerText = "GESPEICHERT!";
            setTimeout(() => btn.innerText = "PROFIL SPEICHERN", 2000);
            updatePersonalLink();
        }

        function updatePersonalLink() {
            const name = document.getElementById('display-name').value || "User";
            const cleanName = name.replace(/\s+/g, '').toLowerCase();
            const mycRaw = document.getElementById('myc-ref').value.trim();
            let encodedMyc = mycRaw ? btoa(mycRaw) : "";
            let finalUrl = "https://room-3.live?ref=" + cleanName + (encodedMyc ? "&cid=" + encodedMyc : "");
            document.getElementById('personal-url').value = finalUrl;
            document.getElementById('badge-name').innerText = name;
        }

        function startMeeting() {
            const link = document.getElementById('meet-code').value;
            if(link) window.open(link, '_blank');
        }

        function copyMeetLink() {
            const field = document.getElementById('meet-code');
            field.select();
            document.execCommand("copy");
            const btn = document.getElementById('copy-meet-btn');
            btn.innerText = "KOPIERT!";
            setTimeout(() => btn.innerText = "LINK KOPIEREN", 2000);
        }

        function copyPersonalLink() {
            const field = document.getElementById('personal-url');
            field.select();
            document.execCommand("copy");
            const btn = document.getElementById('copy-marketing-btn');
            btn.innerText = "KOPIERT!";
            setTimeout(() => btn.innerText = "LINK KOPIEREN", 2000);
        }
    </script>

    <script type="text/javascript">function googleTranslateElementInit() { new google.translate.TranslateElement({ pageLanguage: 'de', layout: google.translate.TranslateElement.InlineLayout.SIMPLE, multilanguagePage: true }, 'google_translate_element'); }</script><script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
